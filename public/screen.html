<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tableau de bord</title>
    <meta name="color-scheme" content="dark" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-latin.woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"
    ></script>

    <style>
      /* ========== DESIGN SYSTEM ==========
         Fond noir, élévation par la seule luminosité (#000 -> #111 -> #1a1a1a).
         Aucun verre, aucun dégradé, aucune ombre sur les panneaux.
         La couleur vient de la pochette de l'album et ne touche que les données. */
      @font-face {
        font-family: "Space Grotesk";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/space-grotesk-latin.woff2") format("woff2");
      }

      :root {
        --bg-primary: #0a0a0b;
        --bg-card: #141416;
        --bg-panel: #1c1c1f;
        --rule: #232326;

        --text-primary: #f2f1ee;
        --text-secondary: #b0afab;
        --text-muted: #8e8d89;

        /* Couleur de l'album : primaire et accent */
        --album-r: 78;
        --album-g: 205;
        --album-b: 196;
        --album-ar: 167;
        --album-ag: 139;
        --album-ab: 250;
        --accent: rgb(var(--album-r), var(--album-g), var(--album-b));

        /* Espacement : une seule gouttière, plus généreuse sur grand écran
           pour rester hors de l'overscan des téléviseurs. */
        --gap: clamp(20px, 1.3vw, 44px);
        --safe: clamp(24px, 2.5vw, 96px);
        --gap-sm: 0.5rem;
        --gap-md: 1rem;
        --gap-lg: 1.5rem;

        --radius-sm: 0.625rem;
        --radius-md: 1rem;
        --radius-lg: 1.25rem;

        --duration-fast: 0.15s;
        --duration-normal: 0.25s;
        --duration-slow: 0.45s;
        --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);

        /* Conservé : le JS bascule cette variable en mode économie */
        --theme-transition: 1.2s;
        --cover-fade-half: 0.3s;
        --theme-ease: cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* ========== BASE ========== */
      html {
        /* Sur un téléviseur 1080p ou 4K, l'interface suit la largeur :
           1 % de la largeur, jamais moins de 16 px. */
        font-size: clamp(16px, 1vw, 40px);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: "Inter", -apple-system, system-ui, sans-serif;
        font-feature-settings: "cv11" 1;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        overflow: hidden;
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      /* Teinte de la pochette : à plat, très basse, aucun blend GPU. */
      .album-color-wash {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0;
        background: var(--accent);
        transition: opacity var(--theme-transition) var(--theme-ease);
      }

      .album-color-wash.active {
        opacity: 0.06;
      }

      /* Les orbes sont retirés : éléments conservés pour le JS. */
      .bg-orb {
        display: none;
      }

      /* ========== GRILLE ==========
         12 colonnes x 11 lignes, gouttière 20px, marge 20px.
         1440px : colonne = (1440 - 40 - 220) / 12 = 98.33px
         gauche = 4 x 98.33 + 3 x 20 = 453.3px ; droite = 8 x 98.33 + 7 x 20 = 926.7px */
      .dashboard {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        grid-template-rows: repeat(11, 1fr);
        gap: var(--gap);
        padding: var(--safe);
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 1;
      }

      /* ========== CARTES ========== */
      .card {
        background: var(--bg-card);
        border: 0;
        border-radius: var(--radius-lg);
        padding: var(--gap-lg);
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 0;
        z-index: 1;
      }

      .card.hidden {
        display: none !important;
      }

      /* Entrée discrète : opacité et 8px, jamais de flou. */
      .card:not(.hidden):not(.entered) {
        animation: cardEnter var(--duration-slow) var(--ease-spring) forwards;
      }

      @keyframes cardEnter {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .card.entered {
        opacity: 1;
        transform: none;
      }

      /* ========== HEURE ========== */
      #timeCard {
        grid-column: 1 / 5;
        grid-row: 1 / 5;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 18px;
      }

      .time-display {
        font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
        font-size: clamp(2.6rem, 5.2vw, 6.25rem);
        font-weight: 500;
        letter-spacing: -0.035em;
        line-height: 1;
        white-space: nowrap;
        color: var(--text-primary);
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1;
      }

      .time-separator {
        display: none;
      }

      .time-seconds {
        color: #b0afab;
        color: color-mix(in srgb, var(--accent) 45%, #f2f1ee 55%);
      }

      .date-display {
        font-size: clamp(0.95rem, 1.2vw, 1.15rem);
        font-weight: 400;
        color: var(--text-secondary);
        text-align: center;
        line-height: 1.4;
        letter-spacing: 0.01em;
      }

      /* ========== MÉTÉO ========== */
      #weatherCard {
        grid-column: 1 / 5;
        grid-row: 5 / 12;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--gap-lg);
      }

      .weather-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 14px;
        width: 100%;
        height: 100%;
      }

      .weather-icon {
        width: clamp(6rem, 12vw, 8.75rem);
        height: clamp(6rem, 12vw, 8.75rem);
        flex-shrink: 0;
        margin-bottom: 4px;
        transition: opacity 0.2s var(--ease-smooth);
      }

      .weather-temp {
        font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
        font-feature-settings: "tnum" 1;
        font-size: clamp(3rem, 5vw, 4.75rem);
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        color: var(--text-primary);
      }

      .weather-condition {
        font-size: clamp(1.15rem, 1.7vw, 1.4rem);
        font-weight: 400;
        color: var(--text-secondary);
        text-align: center;
        line-height: 1.35;
      }

      .weather-location {
        font-size: clamp(0.85rem, 1.1vw, 1rem);
        font-weight: 500;
        color: var(--text-secondary);
        margin-top: 2px;
      }

      /* Courbe des prochaines 24 h : une seule série, l'accent sur la donnée. */
      .weather-chart {
        width: 100%;
        margin-top: auto;
        padding-top: 1rem;
      }

      .weather-chart svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .weather-chart text {
        font-family: "Inter", system-ui, sans-serif;
        font-size: clamp(12px, 0.75vw, 24px);
        fill: #9a9994;
        font-variant-numeric: tabular-nums;
      }

      .weather-chart .chart-line {
        fill: none;
        stroke: var(--accent);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }

      .weather-chart .chart-grid {
        stroke: #232326;
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }

      .weather-chart .chart-area {
        fill: var(--accent);
        opacity: 0.08;
      }

      .weather-chart .chart-dot {
        fill: var(--accent);
      }

      /* ========== PRÉVISIONS ==========
         Une liste de lignes, pas des colonnes étirées : elle remplit
         la carte aussi bien en 4 lignes qu'en pleine hauteur. */
      #forecastCard {
        grid-column: 5 / 13;
        grid-row: 1 / 5;
        display: flex;
        flex-direction: column;
        background: var(--bg-card);
      }

      #forecastCard.expanded {
        grid-row: 1 / 12;
      }

      .forecast-header {
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--text-muted);
        letter-spacing: 0.02em;
        margin-bottom: 8px;
      }

      .forecast-grid {
        display: grid;
        grid-template-columns: 1fr;
        grid-auto-rows: 1fr;
        flex: 1;
        min-height: 0;
      }

      .forecast-item {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        gap: 14px;
        padding: 5px 0;
        border-top: 1px solid var(--rule);
        min-width: 0;
      }

      .forecast-item:first-child {
        border-top: 0;
      }

      .forecast-time {
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
      }

      .forecast-when {
        flex: 0 0 88px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .forecast-rel {
        display: none;
        font-size: 0.75rem;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }

      .forecast-icon {
        width: 2.1rem;
        height: 2.1rem;
        flex-shrink: 0;
      }

      .forecast-temp {
        flex: 0 0 auto;
        font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
        font-feature-settings: "tnum" 1;
        font-size: 1.6rem;
        font-weight: 500;
        color: var(--text-primary);
        font-variant-numeric: tabular-nums;
      }

      .forecast-desc {
        display: none;
        flex: 1;
        min-width: 0;
        font-size: 0.9rem;
        font-weight: 400;
        color: var(--text-secondary);
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #forecastCard.expanded .forecast-item {
        padding: 14px 0;
      }

      #forecastCard.expanded .forecast-when {
        flex-basis: 110px;
      }

      #forecastCard.expanded .forecast-time {
        font-size: 1.15rem;
      }

      #forecastCard.expanded .forecast-rel {
        display: block;
      }

      #forecastCard.expanded .forecast-icon {
        width: 3.5rem;
        height: 3.5rem;
      }

      #forecastCard.expanded .forecast-temp {
        font-size: 2rem;
      }

      #forecastCard.expanded .forecast-desc {
        display: block;
        font-size: 1rem;
      }

      .forecast-empty {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
        color: var(--text-muted);
        font-size: 0.95rem;
      }

      /* ========== MUSIQUE ========== */
      #musicCard {
        grid-column: 5 / 13;
        grid-row: 5 / 12;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: var(--gap-lg);
        padding: 1.75rem;
        background: var(--bg-card);
      }

      .music-cover-wrapper {
        position: relative;
        flex-shrink: 0;
      }

      .music-cover {
        width: clamp(6.5rem, 11vw, 9rem);
        height: clamp(6.5rem, 11vw, 9rem);
        border-radius: var(--radius-md);
        object-fit: cover;
        opacity: 1;
        transition:
          opacity var(--cover-fade-half) var(--theme-ease),
          filter var(--cover-fade-half) var(--theme-ease);
      }

      .music-cover.cover-fading-out {
        opacity: 0;
        filter: saturate(0.9) brightness(0.78);
      }

      .music-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        min-width: 0;
      }

      .music-track {
        font-size: clamp(1.4rem, 2.2vw, 2rem);
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }

      .music-artist {
        font-size: clamp(1rem, 1.4vw, 1.2rem);
        font-weight: 500;
        color: #b4b4b4;
        color: color-mix(in srgb, var(--accent) 45%, #ffffff 55%);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .music-progress {
        width: 100%;
        max-width: 26rem;
        height: 4px;
        background: #242424;
        border-radius: 4px;
        margin-top: 12px;
        position: relative;
      }

      .music-progress-bar {
        height: 100%;
        background: var(--accent);
        border-radius: 4px;
        width: 0%;
        transition: width 300ms var(--ease-smooth);
      }

      .music-progress-bar::after {
        display: none;
      }

      .music-progress-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
      }

      .music-duration {
        color: var(--text-muted);
        font-size: 0.85rem;
        font-weight: 500;
        min-width: 42px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .music-bottom {
        display: flex;
        flex-direction: row;
        gap: var(--gap-md);
        align-items: center;
        flex-shrink: 0;
      }

      #musicCard:not(.hidden):not(.entered) {
        animation: cardEnter var(--duration-slow) var(--ease-spring) forwards;
      }

      /* ========== PAROLES ========== */
      .lyrics-container {
        position: relative;
        flex: 1;
        min-width: 0;
        width: 100%;
        min-height: 0;
        overflow: hidden;
        max-height: 1000px;
        opacity: 1;
        transition: max-height 300ms var(--ease-smooth), opacity 200ms var(--ease-smooth);
        mask-image: linear-gradient( /* taste-skill-ignore: masque de fondu, pas un remplissage */
          to bottom,
          transparent 0%,
          #000 12%,
          #000 88%,
          transparent 100%
        );
        -webkit-mask-image: linear-gradient( /* taste-skill-ignore: masque de fondu */
          to bottom,
          transparent 0%,
          #000 12%,
          #000 88%,
          transparent 100%
        );
      }

      .lyrics-wrapper {
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 0.6s var(--ease-spring);
      }

      .lyrics-loading,
      .lyrics-none {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        color: var(--text-muted);
        font-size: 1rem;
        text-align: center;
        padding: 2rem;
        display: flex;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s var(--ease-smooth), visibility 0.3s;
        pointer-events: none;
        position: absolute;
        inset: 0;
      }

      .lyrics-loading.active,
      .lyrics-none.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .lyrics-prestart {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 4;
        width: 70px;
        height: 70px;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translate(-50%, calc(-50% + 8px));
        transition: opacity 0.3s var(--ease-smooth), transform 0.3s var(--ease-smooth), visibility 0.3s;
      }

      .lyrics-prestart.active {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, -50%);
      }

      .lyrics-prestart::before,
      .lyrics-prestart-dot {
        display: none;
      }

      .lyrics-container.prestart-waiting .lyrics-content {
        opacity: 0.2;
        transition: opacity 0.25s var(--ease-smooth);
      }

      .lyrics-loading-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid #2a2a2a;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1.4s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .lyrics-line {
        font-size: clamp(1.5rem, 2vw, 1.95rem);
        font-weight: 400;
        color: var(--text-secondary);
        text-align: center;
        line-height: 1.45;
        padding: 0.4rem 1.2rem;
        border-radius: 100px;
        opacity: 0.35;
        transition: opacity 0.35s var(--ease-smooth), color 0.35s var(--ease-smooth), background 0.35s var(--ease-smooth);
        cursor: default;
        width: min(92%, 30ch);
        max-width: 92%;
        white-space: normal;
        word-break: break-word;
        overflow-wrap: anywhere;
        background: transparent;
      }

      .lyrics-line.active {
        font-weight: 500;
        color: var(--text-primary);
        opacity: 1;
        background: transparent;
      }

      .lyrics-line.past {
        opacity: 0.22;
      }

      .lyrics-line.near {
        opacity: 0.55;
      }

      .lyrics-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        padding: 3rem 1.5rem;
        width: 100%;
      }

      /* ========== MUSIQUE PLEIN ÉCRAN ========== */
      #musicCard.fullscreen-mode {
        justify-content: center;
        align-items: center;
      }

      #musicCard.fullscreen-mode .lyrics-container {
        opacity: 0;
        max-height: 0;
        flex: 0 0 0;
        pointer-events: none;
      }

      #musicCard.fullscreen-mode .music-bottom {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--gap-md);
        width: 100%;
        max-width: 480px;
      }

      #musicCard.fullscreen-mode .music-cover-wrapper {
        display: flex;
        justify-content: center;
      }

      #musicCard.fullscreen-mode .music-cover {
        width: clamp(12rem, 27vw, 21rem);
        height: clamp(12rem, 27vw, 21rem);
        border-radius: var(--radius-lg);
      }

      #musicCard.fullscreen-mode .music-info {
        align-items: center;
        text-align: center;
        width: 100%;
        gap: 8px;
      }

      #musicCard.fullscreen-mode .music-track {
        font-size: clamp(1.8rem, 3vw, 2.8rem);
        white-space: normal;
        text-align: center;
        line-height: 1.2;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      #musicCard.fullscreen-mode .music-artist {
        font-size: clamp(1.15rem, 1.8vw, 1.6rem);
        white-space: normal;
        text-align: center;
        line-height: 1.3;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      #musicCard.fullscreen-mode .music-progress-row {
        justify-content: center;
        margin-top: 8px;
      }

      #musicCard.fullscreen-mode .music-progress {
        max-width: 440px;
      }

      /* ========== RESPONSIVE ========== */
      @media (max-width: 1100px) {
        .lyrics-line {
          font-size: clamp(1.25rem, 1.8vw, 1.6rem);
          width: min(96%, 34ch);
          max-width: 96%;
        }
      }

      /* Tablette et téléphone : une seule colonne, la page défile. */
      @media (max-width: 900px) {
        body {
          overflow-x: hidden;
          overflow-y: auto;
          height: auto;
          min-height: 100vh;
        }

        .dashboard {
          grid-template-columns: 1fr;
          grid-template-rows: none;
          grid-auto-rows: auto;
          gap: var(--gap-md);
          padding: var(--gap-md);
          height: auto;
          min-height: 100vh;
        }

        #timeCard,
        #weatherCard,
        #forecastCard,
        #musicCard,
        #forecastCard.expanded {
          grid-column: 1;
          grid-row: auto;
        }

        #timeCard {
          min-height: 30vh;
        }

        #weatherCard {
          min-height: 46vh;
        }

        #forecastCard.expanded .forecast-grid {
          align-content: start;
        }

        #musicCard {
          min-height: 55vh;
        }

        .time-display {
          font-size: clamp(2.6rem, 13vw, 5rem);
        }

        .card {
          padding: var(--gap-md);
        }
      }

      @media (max-width: 520px) {
        .forecast-desc,
        #forecastCard.expanded .forecast-desc {
          display: none;
        }
      }

      /* ========== MESSAGE ========== */
      #messageOverlay {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: rgba(0, 0, 0, 0.72);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.3s var(--ease-smooth), visibility 0.3s;
      }

      #messageOverlay.visible {
        opacity: 1;
        visibility: visible;
        pointer-events: all;
        cursor: pointer;
      }

      #messageBox {
        background: var(--bg-panel);
        border-radius: var(--radius-lg);
        padding: 2.5rem 3rem;
        max-width: 560px;
        width: 100%;
        transform: translateY(12px);
        transition: transform 0.35s var(--ease-spring);
        text-align: center;
      }

      #messageOverlay.visible #messageBox {
        transform: translateY(0);
      }

      #messageFrom {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--accent);
        margin-bottom: 1rem;
      }

      #messageText {
        font-size: 1.25rem;
        font-weight: 400;
        line-height: 1.6;
        color: var(--text-primary);
        white-space: pre-wrap;
        word-break: break-word;
      }

      #messageDismiss {
        margin-top: 1.75rem;
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      /* ========== OUTILS DISCRETS ========== */
      #perfToggleButton,
      #notifyLink {
        position: fixed;
        bottom: 0.875rem;
        z-index: 9999;
        width: 2.125rem;
        height: 2.125rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 0;
        border-radius: 50%;
        color: var(--text-muted);
        cursor: pointer;
        opacity: 0.3;
        transition: opacity var(--duration-fast) var(--ease-smooth), color var(--duration-fast);
        text-decoration: none;
        padding: 0;
      }

      #perfToggleButton {
        right: 0.875rem;
      }

      #notifyLink {
        right: 3.5rem;
      }

      #perfToggleButton:hover,
      #notifyLink:hover,
      #perfToggleButton:focus-visible,
      #notifyLink:focus-visible {
        opacity: 1;
        color: var(--text-primary);
      }

      #perfToggleButton.manual-active {
        opacity: 1;
        color: var(--accent);
      }

      #perfToggleButton::after,
      #notifyLink::after {
        content: attr(data-label);
        position: absolute;
        bottom: calc(100% + 8px);
        right: 0;
        padding: 5px 9px;
        border-radius: 6px;
        background: #1a1a1a;
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 1.2;
        white-space: nowrap;
        opacity: 0;
        transform: translateY(4px);
        pointer-events: none;
        transition: opacity var(--duration-fast) var(--ease-smooth), transform var(--duration-fast) var(--ease-smooth);
      }

      #perfToggleButton:hover::after,
      #perfToggleButton:focus-visible::after,
      #notifyLink:hover::after,
      #notifyLink:focus-visible::after {
        opacity: 1;
        transform: translateY(0);
      }

      #perfToggleButton svg,
      #notifyLink svg {
        width: 17px;
        height: 17px;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* ========== BANDEAU PERFORMANCE ========== */
      #perfBanner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 9998;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 10px 20px;
        background: var(--bg-panel);
        font-size: 0.85rem;
        color: var(--text-secondary);
        gap: 12px;
      }

      #perfBanner.visible {
        display: flex;
      }

      #perfBanner a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
        border-bottom: 1px solid rgba(var(--album-r), var(--album-g), var(--album-b), 0.4);
      }

      #perfBannerDismiss {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 1.1rem;
        line-height: 1;
        padding: 2px 6px;
      }

      #perfBannerDismiss:hover {
        color: var(--text-primary);
      }

      /* ========== MOUVEMENT RÉDUIT ========== */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }

      .reduced-motion,
      .paused-animations {
        animation-play-state: paused !important;
        transition: none !important;
      }

      /* ========== PALIERS DE PERFORMANCE ========== */
      /* Plus aucun filtre ni verre à dégrader : les paliers ne coupent
         que la teinte de fond et les rares animations restantes. */
      body.perf-tier-1 .album-color-wash,
      body.perf-tier-2 .album-color-wash,
      body.perf-tier-3 .album-color-wash,
      body.perf-tier-4 .album-color-wash {
        display: none;
      }

      body.perf-tier-3 .music-cover,
      body.perf-tier-3 .weather-icon,
      body.perf-tier-3 .lyrics-loading-spinner,
      body.perf-tier-4 .music-cover,
      body.perf-tier-4 .weather-icon,
      body.perf-tier-4 .lyrics-loading-spinner {
        animation: none;
      }

      body.perf-tier-4 .music-progress-bar {
        transition: none;
      }
    </style>
  </head>
  <body>
    <!-- Popup message -->
    <div id="messageOverlay" role="dialog" aria-modal="true" aria-labelledby="messageText">
      <div id="messageBox">
        <div id="messageFrom">Un message pour toi</div>

    <div class="dashboard">

        <!-- LYRICS CONTAINER -->
        <div class="lyrics-container" id="lyricsContainer">

          <div class="lyrics-prestart" id="lyricsPrestart">

        <!-- MUSIC INFO BOTTOM -->
        <div class="music-bottom">
          <div class="music-cover-wrapper">
            <img id="cover" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Crect width='400' height='400' rx='32' fill='%231a1a1a'/%3E%3C/svg%3E" alt="Pochette de l'album" class="music-cover" />
          </div>
